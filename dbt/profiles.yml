# Credenciais vêm de variáveis de ambiente, preenchidas por run_dbt.py a partir do .env.
compras_publicas:
  target: supabase
  outputs:
    supabase:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      schema: analytics
      sslmode: require
      threads: 4
    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BQ_PROJECT') }}"
      keyfile: "{{ env_var('DBT_BQ_KEYFILE') }}"
      dataset: analytics
      location: US
      threads: 4
